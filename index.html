<div id="app">

//  ESTADO Y LÓGICA
// ════════════════════════════════════════════
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);

function startQuiz() {
  document.getElementById('screen-intro').style.display = 'none';
  document.getElementById('screen-quiz').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[current];
  const letters = ['A','B','C','D'];

  document.getElementById('section-name').textContent = SECTIONS[q.section];
  document.getElementById('q-counter').textContent = `${current + 1} / ${QUESTIONS.length}`;
  document.getElementById('question-text').textContent = q.text;

  const pct = ((current + 1) / QUESTIONS.length * 100).toFixed(1);
  document.getElementById('progress-fill').style.width = pct + '%';

  const list = document.getElementById('options-list');
  list.innerHTML = '';
  q.options.forEach((opt, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (answers[current] === i ? ' selected' : '');
    btn.innerHTML = `<span class="option-letter">${letters[i]}</span><span>${opt.text}</span>`;
    btn.onclick = () => selectOption(i);
    li.appendChild(btn);
    list.appendChild(li);
  });

  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = answers[current] === null;
  document.getElementById('btn-next').textContent =
    current === QUESTIONS.length - 1 ? 'Ver mi resultado →' : 'Siguiente →';
}

function selectOption(idx) {
  answers[current] = idx;
  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });
  document.getElementById('btn-next').disabled = false;
}

function nextQ() {
  if (answers[current] === null) return;
  if (current === QUESTIONS.length - 1) { showResult(); return; }
  current++;
  renderQuestion();
}

function prevQ() {
  if (current > 0) { current--; renderQuestion(); }
}

function showResult() {
  const totals = {};
  Object.keys(BREADS).forEach(k => totals[k] = 0);

  answers.forEach((ans, qi) => {
    if (ans === null) return;
    const scores = QUESTIONS[qi].options[ans].scores;
    Object.entries(scores).forEach(([k, v]) => {
      if (totals[k] !== undefined) totals[k] += v;
    });
  });

  const winner = Object.entries(totals).sort((a, b) => b[1] - a[1])[0][0];
  const bread = BREADS[winner];

  document.getElementById('screen-quiz').style.display = 'none';
  document.getElementById('screen-result').style.display = 'block';

  document.getElementById('result-emoji').textContent = bread.emoji;
  document.getElementById('result-bread-name').textContent = bread.name;
  document.getElementById('result-bread-origin').textContent = bread.origin;

  document.getElementById('result-body').innerHTML = `
    <h3>${bread.nota}</h3>
    <div class="result-block">
      <span class="tag-label">Lo que cargás</span>
      <span>${bread.herida}</span>
    </div>
    <div class="result-block">
      <span class="tag-label">La gracia</span>
      <span>${bread.gracia}</span>
    </div>
    <div class="result-block result-block-divider">
      <span class="tag-label">Lo que te dice</span>
      <span>${bread.invitacion}</span>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetQuiz() {
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  document.getElementById('screen-result').style.display = 'none';
  document.getElementById('screen-intro').style.display = 'block';
  window.scrollTo({ top: 0 });
}
</script>
